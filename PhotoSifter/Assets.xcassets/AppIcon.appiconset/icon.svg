<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5A52D5"/>
      <stop offset="70%"  stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Back card -->
  <g transform="translate(28, 22) rotate(9, 545, 525)">
    <rect x="355" y="260" width="380" height="530" rx="36"
          fill="white" fill-opacity="0.10"
          stroke="white" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- Middle card -->
  <g transform="translate(13, 10) rotate(3.5, 545, 525)">
    <rect x="355" y="260" width="380" height="530" rx="36"
          fill="white" fill-opacity="0.18"
          stroke="white" stroke-opacity="0.28" stroke-width="2"/>
  </g>

  <!-- Front card: swiping left -->
  <g transform="translate(-82, -12) rotate(-17, 545, 720)">
    <rect x="355" y="260" width="380" height="530" rx="36"
          fill="white" fill-opacity="0.28"
          stroke="white" stroke-opacity="0.50" stroke-width="2.5"/>
  </g>
</svg>
